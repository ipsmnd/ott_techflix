<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechFlix - Kids</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* General Styles */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            overflow-x: hidden;
            position: relative;
        }

        /* Galaxy Animation */
        .galaxy {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.1; }
            50% { opacity: 1; }
        }

        @keyframes moveStar {
            from { transform: translateY(0); }
            to { transform: translateY(-100vh); }
        }
/* Header Styles */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            font-size: 32px;
            background: linear-gradient(45deg, #ff00cc, #3333ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(45deg, #ff00cc, #3333ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        nav ul {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        nav a {
            color: #ddd;
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s;
            padding: 8px 12px;
            border-radius: 20px;
        }

        nav a:hover,
        nav a.active {
            background: rgba(106, 90, 249, 0.3);
            color: #fff;
        }
        
        /* New styles for mobile menu */
        .mobile-menu-btn {
            display: none; /* Hidden by default on desktop */
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        .user-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .search-bar {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 8px 15px;
            display: flex;
            align-items: center;
        }

        .search-bar input {
            background: transparent;
            border: none;
            color: white;
            outline: none;
            width: 150px;
        }

        .search-bar input::placeholder {
            color: #aaa;
        }

        .notification,
        .user-icon {
            background: rgba(255, 255, 255, 0.1);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
        }

        .notification::after {
            content: "3";
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ff4757;
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }


        /* Message box styles (replaces alert) */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 1rem;
            text-align: center;
            max-width: 90%;
            width: 400px;
            position: relative;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }

        .modal-content h3 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #ff00cc;
        }

        .modal-content p {
            margin-bottom: 1.5rem;
            color: #bbb;
        }

        .modal-close {
            background: linear-gradient(45deg, #6a5af9, #d66efd);
            border: none;
            color: white;
            padding: 0.75rem 2rem;
            border-radius: 9999px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.3s ease;
        }

        .modal-close:hover {
            transform: scale(1.05);
        }


        /* New OTT Platform Content Styles */
        .content-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .content-container h2 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: #d66efd;
            border-left: 5px solid #ff00cc;
            padding-left: 10px;
        }

        .content-section {
            margin-bottom: 40px;
        }

        .movie-grid {
            display: grid;
            /* Allow auto-fill and a minimum card width of 180px, flexing to fill space */
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .movie-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }

        .movie-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        .movie-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .movie-info {
            padding: 15px;
        }

        .movie-info h3 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .movie-info p {
            font-size: 0.8rem;
            color: #bbb;
        }

        .movie-info .rating {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(106, 90, 249, 0.8);
            color: white;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
        }


        /* Responsive Adjustments */
        /* For tablets and smaller screens */
        @media (max-width: 768px) {
            /* This is a new CSS rule to show the menu button and hide the nav on small screens */
            .mobile-menu-btn {
                display: block;
            }

            nav {
                display: none; /* Hide the nav menu by default on mobile */
                width: 100%;
                order: 3; /* Move it below the logo and user actions */
            }

            /* This is a new CSS rule to display the nav when the 'nav-open' class is added by JS */
            nav.nav-open {
                display: block;
            }

            nav ul {
                flex-direction: column; /* Stack the nav links vertically */
                align-items: center;
                gap: 10px;
                margin-top: 15px;
            }

            header {
                flex-wrap: wrap; /* Allow items to wrap to a new line */
                justify-content: space-between;
            }
            
            .logo, .user-actions {
                flex: 1;
            }

            .user-actions {
                justify-content: flex-end;
            }
            
            .search-bar input {
                width: 100px;
            }
            .movie-grid {
                gap: 15px;
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
        }

        /* For mobile phones */
        @media (max-width: 480px) {
            .logo {
                flex-direction: column;
                text-align: center;
            }
            .logo-text {
                font-size: 24px;
            }
            .user-actions {
                flex-direction: row;
                justify-content: space-around;
                width: 100%;
                gap: 10px;
            }
            .search-bar {
                padding: 5px 10px;
            }
            .search-bar input {
                width: 80px;
            }
            .movie-grid {
                /* Force a single-column layout for small phones */
                grid-template-columns: 1fr;
                gap: 10px;
            }
            .movie-card img {
                height: auto;
            }
            .content-container h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="galaxy-bg" id="galaxy"></div>

    <header>
        <div class="logo">
            <div class="logo-icon"><i class="fas fa-play-circle"></i></div>
            <div class="logo-text"><a href="index.html">TechFlix</a></div>
        </div>
        
        <button class="mobile-menu-btn" id="mobileMenuBtn">
            <i class="fas fa-bars"></i>
        </button>
        
        <nav id="navMenu"> <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="Browse.html">Browse</a></li> 
                <li><a href="movies.html">Movies</a></li>
                <li><a href="video-player.html">TV Shows</a></li>
                <li><a href="tvshows.html" class="active">Kids</a></li> 
                <li><a href="Profile.html">Profile</a></li>
            </ul>
        </nav>
        <div class="user-actions">
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Search...">
            </div>
            <div class="notification">
                <i class="fas fa-bell"></i>
            </div>
            <div class="user-icon">
                <img src="./img/pabitraswain.jpg" alt="PS"
                    style="height: 40px; width: 40px; border-radius: 50%; border: 0.1rem solid  #ff00cc;">
            </div>
        </div>
    </header>


    <div class="content-container">
        <div class="content-section">
            <h2>Featured for You</h2>
            <div class="movie-grid" id="featured-movies">
                </div>
        </div>

        <div class="content-section">
            <h2>Popular Shows</h2>
            <div class="movie-grid" id="popular-shows">
                </div>
        </div>

        <div class="content-section">
            <h2>Educational Adventures</h2>
            <div class="movie-grid" id="educational-content">
                </div>
        </div>
    </div>
    
    <div id="message-modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title"></h3>
            <p id="modal-message"></p>
            <button id="modal-close-btn" class="modal-close">Close</button>
        </div>
    </div>


    <script>
        // Data for the movies and shows
        const featuredContent = [
            { id: 1, title: 'The Great Dino Adventure', description: 'A journey back in time with friendly dinosaurs.', rating: '5+' },
            { id: 2, title: 'Space Explorers', description: 'Two kids and their robot friend explore the galaxy.', rating: '4+' },
            { id: 3, title: 'The Magical Treehouse', description: 'Every day is a new magical adventure.', rating: '5+' },
            { id: 4, title: 'Robo-Racers', description: 'Fast-paced fun with racing robots.', rating: '6+' },
            { id: 5, title: 'Mysteries of the Ocean', description: 'Join Captain Coral on an underwater quest.', rating: 'All' },
        ];

        const popularShows = [
            { id: 6, title: 'Coding Crusaders', description: 'Solving problems with the power of code.', rating: '7+' },
            { id: 7, title: 'Farm Friends', description: 'Life on the farm with animals.', rating: '3+' },
            { id: 8, title: 'The Color Kingdom', description: 'Learning colors and shapes.', rating: '2+' },
            { id: 9, title: 'Storytime with Squeaky', description: 'A new bedtime story every night.', rating: 'All' },
            { id: 10, title: 'The Art Club', description: 'Unleash your creativity with paint and clay.', rating: '5+' },
        ];

        const educationalContent = [
            { id: 11, title: 'Planet Quest', description: 'An animated series about the solar system.', rating: '6+' },
            { id: 12, title: 'Math Monsters', description: 'Making numbers and counting fun!', rating: '4+' },
            { id: 13, title: 'Science Lab Kids', description: 'Simple, fun science experiments.', rating: '7+' },
            { id: 14, title: 'Animal ABCs', description: 'Learn the alphabet with animals.', rating: '3+' },
            { id: 15, title: 'History Heroes', description: 'Meeting famous figures from the past.', rating: '8+' },
        ];

        // A simple function to generate a unique but consistent placeholder image URL
        function getPlaceholderImageUrl(text) {
            const width = 400;
            const height = 600;
            const colors = ['6a5af9', 'd66efd', 'ff00cc', '3333ff'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            return `https://placehold.co/${width}x${height}/${randomColor}/fff?text=${encodeURIComponent(text)}`;
        }

        // Function to create a movie card element
        function createMovieCard(movie) {
            const card = document.createElement('div');
            card.classList.add('movie-card');
            card.setAttribute('data-id', movie.id);
            card.innerHTML = `
                <img src="${getPlaceholderImageUrl(movie.title)}" alt="${movie.title}" onerror="this.onerror=null; this.src='https://placehold.co/400x600/6a5af9/fff?text=Image+Unavailable';">
                <div class="movie-info">
                    <h3 class="font-semibold">${movie.title}</h3>
                    <p>${movie.description}</p>
                    <span class="rating">${movie.rating}</span>
                </div>
            `;
            return card;
        }

        // Function to render movies into a grid
        function renderMovies(containerId, movies) {
            const container = document.getElementById(containerId);
            if (container) {
                movies.forEach(movie => {
                    const card = createMovieCard(movie);
                    container.appendChild(card);
                });
            }
        }

        // Custom modal function to replace alert()
        function showMessageModal(title, message) {
            const modal = document.getElementById('message-modal');
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-message').textContent = message;
            modal.style.display = 'flex';
        }

        // Event listener to close the modal
        document.getElementById('modal-close-btn').addEventListener('click', () => {
            document.getElementById('message-modal').style.display = 'none';
        });

        // Event delegation for movie card clicks
        document.addEventListener('click', function(event) {
            if (event.target.closest('.movie-card')) {
                const card = event.target.closest('.movie-card');
                const title = card.querySelector('h3').textContent;
                showMessageModal(title, `Loading your adventure: "${title}". Enjoy!`);
            }
        });


        // Create galaxy background
        function createGalaxy() {
            const galaxy = document.getElementById('galaxy');
            const starsCount = 200;

            for (let i = 0; i < starsCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');

                const posX = Math.random() * 100;
                const posY = Math.random() * 100;
                const size = Math.random() * 2.5 + 0.5;
                const duration = Math.random() * 5 + 3;

                star.style.left = `${posX}%`;
                star.style.top = `${posY}%`;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.setProperty('--duration', `${duration}s`);
                star.style.animation = `moveStar ${duration * 10}s linear infinite`;

                galaxy.appendChild(star);
            }
        }

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            createGalaxy();
            renderMovies('featured-movies', featuredContent);
            renderMovies('popular-shows', popularShows);
            renderMovies('educational-content', educationalContent);
            
            // New JavaScript to handle the mobile menu functionality
            const mobileMenuBtn = document.getElementById('mobileMenuBtn');
            const navMenu = document.getElementById('navMenu');

            mobileMenuBtn.addEventListener('click', () => {
                navMenu.classList.toggle('nav-open');
            });
        });
    </script>
</body>

</html>
